<!DOCTYPE html>
<html lang="en" class="ds3-loading" data-density="regular" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Patona OMS 2.0 — Sale</title>

<!-- DS3 web-component bundle + runtime patch.
     ds3-patch.js injects CSS into each ssk-* shadow DOM to fix the issues
     documented in "DS3 Issues Report.md" — when DS3 ships those fixes
     upstream, this script can be removed. -->
<script type="module">
  import 'https://esm.sh/@uxuissk/design-system-core@3.5.5';
  const tags = ['ssk-app-shell-provider', 'ssk-button', 'ssk-input', 'ssk-tabs',
                'ssk-card-select', 'ssk-badge', 'ssk-avatar'];
  const tick = () => {
    if (tags.every(t => customElements.get(t))) {
      document.documentElement.classList.remove('ds3-loading');
    } else {
      requestAnimationFrame(tick);
    }
  };
  tick();
</script>
<script src="ds3-patch.js?v=5" defer></script>

<link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- Patona brand provider — injects --button-solid-bg, --fg-brand-primary,
     --text-primary, and the DB HeaventRounded font onto every descendant. -->
<ssk-app-shell-provider brand="patona">
  <div id="root"></div>
</ssk-app-shell-provider>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<!-- data + helpers -->
